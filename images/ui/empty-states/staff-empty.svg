<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360">
  <!-- 空状态：伙计空（空茶碗 + 叠好的抹布，待人归） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF6F0"/><stop offset="1" stop-color="#EFE3CF"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#bg)"/>
  <!-- 木托盘 -->
  <ellipse cx="240" cy="244" rx="150" ry="22" fill="#8B6F47" opacity="0.85"/>
  <ellipse cx="240" cy="238" rx="150" ry="20" fill="#A0805A"/>
  <ellipse cx="240" cy="238" rx="118" ry="14" fill="none" stroke="#8B6F47" stroke-opacity="0.5" stroke-width="1.5"/>
  <!-- 空茶碗 -->
  <path d="M 200 190 L 280 190 L 272 232 C 268 240 212 240 208 232 Z" fill="#FDF6F0" stroke="#8B5E3C" stroke-width="2.5"/>
  <ellipse cx="240" cy="190" rx="40" ry="9" fill="#F1E7D2" stroke="#8B5E3C" stroke-width="2"/>
  <ellipse cx="240" cy="190" rx="30" ry="6" fill="#E8D9BC"/>
  <!-- 热气（已凉，微不可察） -->
  <path d="M 232 176 C 228 168 234 164 230 156 M 248 176 C 244 166 250 162 246 154" fill="none" stroke="#D4A843" stroke-opacity="0.25" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 叠好的抹布 -->
  <path d="M 300 228 C 300 212 320 212 320 228 L 320 236 C 320 242 300 242 300 236 Z" fill="#F5F0E8" stroke="#8B5E3C" stroke-width="1.8"/>
  <line x1="310" y1="216" x2="310" y2="240" stroke="#8B5E3C" stroke-opacity="0.4" stroke-width="1.2"/>
  <line x1="304" y1="228" x2="316" y2="228" stroke="#8B5E3C" stroke-opacity="0.3" stroke-width="1"/>
  <!-- 茶碗倒影 -->
  <ellipse cx="240" cy="252" rx="34" ry="5" fill="#6B5636" opacity="0.2"/>
  <!-- 底部文案 -->
  <text x="240" y="302" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="18" fill="#8B6F47" letter-spacing="6">茶凉人未归 · 空碗待添</text>
  <text x="240" y="332" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8B5E3C" fill-opacity="0.7" letter-spacing="3">还没有伙计在店中</text>
</svg>
