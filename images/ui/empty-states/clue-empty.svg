<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360">
  <!-- 空状态：蛛丝马迹空（空白蚕纸 + 一根线索） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF6F0"/><stop offset="1" stop-color="#EFE3CF"/>
    </linearGradient>
    <filter id="paperShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8B5E3C" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="480" height="360" fill="url(#bg)"/>
  <!-- 桌面 -->
  <rect x="50" y="258" width="380" height="10" rx="4" fill="#8B6F47" opacity="0.6"/>
  <!-- 空白蚕纸（边缘微卷） -->
  <g filter="url(#paperShadow)">
    <path d="M 120 96 C 190 88 300 86 372 96 C 380 98 382 104 380 112 L 372 244 C 368 252 360 256 348 254 L 130 246 C 116 244 110 236 112 224 L 118 108 C 119 100 116 97 120 96 Z" fill="#FBF6EA" stroke="#C9B48C" stroke-width="1.8"/>
    <!-- 左缘微卷 -->
    <path d="M 120 96 C 112 108 110 220 112 224 C 116 218 118 140 118 108 Z" fill="#F1E7D2"/>
  </g>
  <!-- 空白纸面（无字） -->
  <g stroke="#C9B48C" stroke-opacity="0.35" stroke-width="1">
    <line x1="160" y1="130" x2="300" y2="130"/><line x1="160" y1="150" x2="300" y2="150"/>
    <line x1="160" y1="170" x2="300" y2="170"/><line x1="160" y1="190" x2="300" y2="190"/>
  </g>
  <!-- 一根线索（红线横过纸面） -->
  <path d="M 90 210 C 160 196 260 200 360 214" fill="none" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="6 4" opacity="0.85"/>
  <circle cx="90" cy="210" r="3" fill="#C0392B" opacity="0.8"/>
  <circle cx="360" cy="214" r="3" fill="#C0392B" opacity="0.8"/>
  <!-- 底部文案 -->
  <text x="240" y="302" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="18" fill="#8B6F47" letter-spacing="6">蛛丝犹在 · 马迹未寻</text>
  <text x="240" y="332" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8B5E3C" fill-opacity="0.7" letter-spacing="3">还没有收集到任何线索</text>
</svg>
