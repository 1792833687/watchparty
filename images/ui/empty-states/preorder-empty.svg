<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360">
  <!-- 空状态：预购订单空（空白契约 + 镇纸 + 朱泥印盒） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF6F0"/><stop offset="1" stop-color="#EFE3CF"/>
    </linearGradient>
    <filter id="paperShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#8B5E3C" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="480" height="360" fill="url(#bg)"/>
  <!-- 桌面 -->
  <rect x="50" y="252" width="380" height="10" rx="4" fill="#8B6F47" opacity="0.6"/>
  <!-- 空白契约纸 -->
  <g filter="url(#paperShadow)">
    <path d="M 150 110 L 330 110 L 330 236 L 150 236 Z" fill="#FBF6EA" stroke="#C9B48C" stroke-width="1.8"/>
  </g>
  <!-- 契约竖排横线（空白） -->
  <g stroke="#C9B48C" stroke-opacity="0.35" stroke-width="1">
    <line x1="170" y1="136" x2="310" y2="136"/><line x1="170" y1="156" x2="310" y2="156"/>
    <line x1="170" y1="176" x2="310" y2="176"/><line x1="170" y1="196" x2="310" y2="196"/>
  </g>
  <!-- 契约抬头：预购契 -->
  <text x="240" y="130" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="15" fill="#8B6F47" opacity="0.55" letter-spacing="8">预 购 契</text>
  <!-- 镇纸压角 -->
  <rect x="300" y="210" width="52" height="16" rx="5" fill="#8B6F47" stroke="#6B5636" stroke-width="1.5"/>
  <!-- 朱泥印盒（未开） -->
  <ellipse cx="120" cy="238" rx="22" ry="14" fill="#C0392B" opacity="0.85"/>
  <ellipse cx="120" cy="232" rx="22" ry="12" fill="#A03022"/>
  <ellipse cx="120" cy="232" rx="12" ry="6" fill="#8A2820"/>
  <!-- 毛笔搁置（未蘸朱泥） -->
  <line x1="96" y1="150" x2="150" y2="214" stroke="#2C2C2C" stroke-width="3" stroke-linecap="round"/>
  <path d="M 146 208 C 152 218 150 226 145 230 C 140 226 138 216 143 210 Z" fill="#C0392B" opacity="0.7"/>
  <!-- 底部文案 -->
  <text x="240" y="300" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="18" fill="#8B6F47" letter-spacing="6">契约未立 · 朱泥未蘸</text>
  <text x="240" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8B5E3C" fill-opacity="0.7" letter-spacing="3">还没有预购订单</text>
</svg>
