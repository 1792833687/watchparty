<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- 成就徽章：朱红圆印 + 白文刻字 -->
  <circle cx="64" cy="64" r="50" fill="#C0392B"/>
  <circle cx="64" cy="64" r="50" fill="none" stroke="#8E2820" stroke-width="2"/>
  <circle cx="64" cy="64" r="42" fill="none" stroke="#F5F0E8" stroke-opacity="0.75" stroke-width="2"/>
  <circle cx="64" cy="64" r="34" fill="none" stroke="#F5F0E8" stroke-opacity="0.45" stroke-width="1.2"/>
  <!-- 白文「功」字（印面惯例） -->
  <text x="64" y="76" text-anchor="middle" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="40" font-weight="700" fill="#F5F0E8" letter-spacing="2">功</text>
  <!-- 顶部提环 -->
  <path d="M 52 12 C 52 4 76 4 76 12" fill="none" stroke="#C0392B" stroke-width="5" stroke-linecap="round"/>
</svg>
